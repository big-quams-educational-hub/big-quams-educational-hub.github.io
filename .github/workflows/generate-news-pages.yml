name: Generate News Preview Pages

on:
  schedule:
    - cron: '*/20 * * * *'   # every 20 minutes - now safe with 30 limit
  workflow_dispatch: {}      # keep manual button for breaking news

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install firebase

      - name: Generate pages & post to Facebook
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ID_2: ${{ secrets.FB_PAGE_ID_2 }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ACCESS_TOKEN_2: ${{ secrets.FB_PAGE_ACCESS_TOKEN_2 }}
        run: node scripts/generate-news-pages.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "news-page-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news/ sitemap-news.xml fb-posted-articles.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-generate news preview pages [skip ci]"
            git push
          fi
