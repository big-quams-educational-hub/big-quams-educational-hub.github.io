name: Generate News Preview Pages

# Firestore changes (new/edited articles from the admin panel) don't trigger
# a git push, so this can't be a simple "on: push" workflow. It runs on a
# schedule to pick up new/edited articles automatically, and can also be
# triggered manually right after publishing something important.
on:
  schedule:
    - cron: '*/20 * * * *'   # every 20 minutes
  workflow_dispatch: {}       # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: generate-news-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate static article pages
        # FB_PAGE_ID / FB_PAGE_ACCESS_TOKEN are optional — Facebook
        # auto-posting stays off until both are added as repo secrets
        # (Settings → Secrets and variables → Actions → New repository
        # secret). Nothing else here changes either way.
        #
        # One shared System User token posts to both Pages. FB_PAGE_ID can
        # hold either a single Page ID or a comma-separated list
        # ("1170305112838317,109930298011435"); FB_PAGE_ID_2 is an
        # alternate way to add the second Page ID as its own secret instead
        # — set one or the other, not both. FB_PAGE_ID_2 is optional and
        # safe to leave unset.
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ID_2: ${{ secrets.FB_PAGE_ID_2 }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: node scripts/generate-news-pages.mjs

      - name: Commit and push if anything changed
        run: |
          git config user.name "news-page-bot"
          git config user.email "actions@users.noreply.github.com"
          # news-state.json is no longer generated/tracked — the script now
          # does a full fetch every run instead of an incremental one, so
          # there's no checkpoint file to commit. (It caused real problems:
          # a missed article, when the incremental filter's field wasn't
          # set on that document, and a merge conflict between two
          # overlapping runs that then silently "succeeded" without
          # actually pushing — see the retry loop fix below.)
          git add news/ sitemap-news.xml fb-posted-articles.json
          if git diff --staged --quiet; then
            echo "No article changes — nothing to commit."
            exit 0
          fi
          git commit -m "Auto-generate news preview pages [skip ci]"

          # Another run (scheduled + a manual click overlapping, or a
          # commit landing from elsewhere) can push to main between this
          # job's checkout and this push. Rebase onto whatever's there now
          # instead of failing outright.
          #
          # -X theirs resolves any conflict by keeping THIS run's version
          # of the conflicting file (in `git rebase`, confusingly, "theirs"
          # means the commit being replayed — i.e. local — not the
          # upstream one). That's safe here specifically because every
          # committed file (news/*, sitemap-news.xml,
          # fb-posted-articles.json) is fully regenerated from Firestore
          # each run; there's no hand-authored content that could be lost.
          # Do NOT reuse this flag if a non-generated file is ever added to
          # this commit.
          success=false
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then
              success=true
              break
            fi
            echo "Push attempt $attempt failed — aborting any stuck rebase and retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done

          # CRITICAL: fail the job loudly if every attempt failed, instead
          # of letting the step exit 0 with nothing actually pushed. That
          # exact silent failure happened once already — the script's
          # local output (including a real Facebook post) went out, but
          # the page itself never reached the live site, and the run still
          # showed a green checkmark.
          if [ "$success" != "true" ]; then
            echo "::error::Failed to push after 5 attempts — generated pages were NOT saved to the repo."
            exit 1
          fi
